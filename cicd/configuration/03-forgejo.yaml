apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-pvc
  namespace: forgejo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: Secret
stringData:
  username: forgejo_admin
  password: changeme
metadata:
  name: forgejo-admin-secret
  namespace: forgejo
type: Opaque
---
apiVersion: v1
kind: Secret
stringData:
  password: changeme
metadata:
  name: forgejo-postgres-secret
  namespace: forgejo
type: Opaque
---
apiVersion: v1
kind: Secret
stringData:
  key: forgejo
  secret: changeme
metadata:
  name: forgejo-oidc-secret
  namespace: forgejo
type: Opaque
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: forgejo
  namespace: forgejo
spec:
  chart: oci://code.forgejo.org/forgejo-helm/forgejo
  version: 17.1.0
  targetNamespace: forgejo
  valuesContent: |-
    gitea:
      admin:
        existingSecret: forgejo-admin-secret
      config:
        APP_NAME: Forgejo
        actions:
          ENABLED: true
          ARTIFACT_RETENTION_DAYS: 1
        packages:
          ENABLED: true
        server:
          DOMAIN: forgejo.home.arpa
          ROOT_URL: https://forgejo.home.arpa
        database:
          DB_TYPE: postgres
          HOST: postgres.storage.svc.cluster.local
          NAME: forgejo
          USER: forgejo
          SCHEMA: public
        service:
          DISABLE_REGISTRATION: false
          ALLOW_ONLY_EXTERNAL_REGISTRATION: true
      additionalConfigFromEnvs:
        - name: FORGEJO__DATABASE__PASSWD
          valueFrom:
            secretKeyRef:
              name: forgejo-postgres-secret
              key: password
      oauth:
        - name: "Keycloak"
          provider: "openidConnect"
          existingSecret: "forgejo-oidc-secret"
          autoDiscoverUrl: "http://keycloak.home.arpa/realms/homelab/.well-known/openid-configuration"
    valkey:
      enabled: false
    valkey-cluster:
      enabled: false
    postgresql:
      enabled: false
    postgresql-ha:
      enabled: false
    persistence:
      enabled: true
      create: false
      mount: true
      claimName: forgejo-pvc
