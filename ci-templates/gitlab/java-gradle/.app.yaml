spec:
  inputs:
    build-image: {}
    gitops-repository: {}
---
stages:
  - dependencies
  - quality-control
  - build
  - release
  - gitops

.gradle-defaults:
  image: $[[ inputs.build-image ]]

.gradle-cache:
  extends: .gradle-defaults
  variables:
    GRADLE_USER_HOME: "${CI_PROJECT_DIR}/.gradle"
  cache:
    key:
      files:
        - build.gradle
    paths:
      - .gradle/caches/

download-dependencies:
  stage: dependencies
  extends: .gradle-cache
  script:
    - gradle dependencies

check:
  stage: quality-control
  extends: .gradle-cache
  script:
    - gradle compileJava

test:
  stage: quality-control
  extends: .gradle-cache
  needs: [check]
  script:
    - gradle test

format:
  stage: quality-control
  extends: .gradle-defaults
  needs: [check]
  allow_failure: true
  script:
    - echo "Not configured"
    - exit 1

lint:
  stage: quality-control
  extends: .gradle-defaults
  needs: [check]
  allow_failure: true
  script:
    - echo "Not configured"
    - exit 1

build-application:
  stage: build
  extends: [.gradle-cache]
  rules:
    - if: $CI_COMMIT_TAG =~ /[0-9]+\.[0-9]+\.[0-9]+/
  script:
    - gradle assemble
  artifacts:
    expire_in: 1h
    paths:
      - build/libs/*.jar

include:
  - local: '/shared/.release-container-image.yaml'
    rules:
      - if: $CI_COMMIT_TAG =~ /[0-9]+\.[0-9]+\.[0-9]+/
  - local: '/shared/.release-helm-package.yaml'
    rules:
      - if: $CI_COMMIT_TAG =~ /[0-9]+\.[0-9]+\.[0-9]+/
    inputs:
      gitops-repository: $[[ inputs.gitops-repository ]]
  - local: '/shared/.trigger-gitops-pipeline.yaml'
    rules:
      - if: $CI_COMMIT_TAG =~ /[0-9]+\.[0-9]+\.[0-9]+/
    inputs:
      gitops-repository: $[[ inputs.gitops-repository ]]
