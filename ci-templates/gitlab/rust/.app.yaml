spec:
  inputs:
    build-image: {}
    build-target: {}
    gitops-repository: {}
---
stages:
  - dependencies
  - quality-control
  - build
  - release
  - gitops

.rust-defaults:
  image: $[[ inputs.build-image ]]
  variables:
    RUST_BACKTRACE: short

.rust-cache:
  extends: .rust-defaults
  variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  cache:
    key:
      files:
        - Cargo.toml
        - Cargo.lock
    paths:
      - .cargo

download-dependencies:
  stage: dependencies
  extends: .rust-cache
  script:
    - cargo fetch

check:
  stage: quality-control
  extends: .rust-cache
  script:
    - cargo check

test:
  stage: quality-control
  extends: .rust-cache
  needs: [check]
  script:
    - cargo test

format:
  stage: quality-control
  extends: .rust-defaults
  needs: [check]
  script:
    - rustup component add rustfmt
    - cargo fmt --check

lint:
  stage: quality-control
  extends: .rust-cache
  needs: [check]
  allow_failure: true
  script:
    - rustup component add clippy
    - cargo clippy -- -D warnings

build-application:
  stage: build
  extends: [.rust-cache]
  rules:
    - if: $CI_COMMIT_TAG =~ /[0-9]+\.[0-9]+\.[0-9]+/
  script:
    - rustup target add $[[ inputs.build-target ]]
    - cargo build --release --target $[[ inputs.build-target ]]
  artifacts:
    expire_in: 1h
    paths:
      - target/$[[ inputs.build-target ]]/release/$CI_PROJECT_NAME

include:
  - local: '/shared/.release-container-image.yaml'
    rules:
      - if: $CI_COMMIT_TAG =~ /[0-9]+\.[0-9]+\.[0-9]+/
  - local: '/shared/.release-helm-package.yaml'
    rules:
      - if: $CI_COMMIT_TAG =~ /[0-9]+\.[0-9]+\.[0-9]+/
    inputs:
      gitops-repository: $[[ inputs.gitops-repository ]]
  - local: '/shared/.trigger-gitops-pipeline.yaml'
    rules:
      - if: $CI_COMMIT_TAG =~ /[0-9]+\.[0-9]+\.[0-9]+/
    inputs:
      gitops-repository: $[[ inputs.gitops-repository ]]
