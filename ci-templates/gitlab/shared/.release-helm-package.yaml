spec:
  inputs:
    gitops-repository: {}
---
build-helm-package:
  stage: build
  image:
    name: alpine/helm:4.0
    entrypoint: ["/bin/sh"]
  rules:
    - exists: "charts/${CI_PROJECT_NAME}/"
  script:
    - helm lint ./charts/$CI_PROJECT_NAME/
    - helm package ./charts/$CI_PROJECT_NAME/ --version $CI_COMMIT_TAG --app-version $CI_COMMIT_TAG
  artifacts:
    expire_in: 1h
    paths:
      - ${CI_PROJECT_NAME}-${CI_COMMIT_TAG}.tgz

release-helm-package:
  stage: release
  image: curlimages/curl:latest
  rules:
    - exists: "charts/${CI_PROJECT_NAME}/"
  needs:
    - job: build-helm-package
      artifacts: true
  script:
    - 'GITOPS_PROJECT=$(echo "$[[ inputs.gitops-repository ]]" | sed ''s/\//%2F/g'')'
    - 'curl --fail-with-body --request POST --user gitlab-ci-token:$CI_JOB_TOKEN --form "chart=@${CI_PROJECT_NAME}-${CI_COMMIT_TAG}.tgz" "${CI_API_V4_URL}/projects/${GITOPS_PROJECT}/packages/helm/api/stable/charts"'
