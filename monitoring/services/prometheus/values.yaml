server:
  extraArgs:
    web.enable-remote-write-receiver: null
  persistentVolume:
    size: 1Gi
    storageClass: local-path
  retention: 15d
  statefulSet:
    pvcDeleteOnStsDelete: false
    pvcDeleteOnStsScale: false

alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false

serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
            - localhost:9090
