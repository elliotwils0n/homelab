apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio
spec:
  destination:
    name: 'example-cluster'
    namespace: istio-system
  project: example
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  sources:
    - path: ''
      repoURL: 'https://istio-release.storage.googleapis.com/charts'
      targetRevision: 1.27.1
      chart: base
    - path: ''
      repoURL: 'https://istio-release.storage.googleapis.com/charts'
      targetRevision: 1.27.1
      chart: istiod
      helm:
        valueFiles:
          - $values/worker/services/istio/values.yaml
    - repoURL: 'https://forgejo.home.arpa/homelab/homelab.git'
      targetRevision: master
      ref: values
    - repoURL: 'https://forgejo.home.arpa/homelab/homelab.git'
      targetRevision: master
      path: worker/services/istio/
